services:
  # Keep the current service name as the API so the existing onrender.com
  # hostname continues to work as the backend base URL.
  - type: web
    name: desarrollo-web-4ec5
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm install && npm --prefix server install
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_CLIENT_IDS
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SHEETS_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://ansemenu.webcindario.com,https://ztartech.webcindario.com,https://desarrollo-web-4ec5-static.onrender.com
      - key: CORS_ORIGIN
        value: https://ansemenu.webcindario.com,https://ztartech.webcindario.com,https://desarrollo-web-4ec5-static.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://ansemenu.webcindario.com,https://ztartech.webcindario.com,https://desarrollo-web-4ec5-static.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://ansemenu.webcindario.com,https://ztartech.webcindario.com,https://desarrollo-web-4ec5-static.onrender.com
      - key: SESSION_COOKIE_NAME
        value: ztar_session
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: ALERT_APP_NAME
        value: Ztar Tech
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ORDER_ALERT_WEBHOOK_URL
        sync: false
      - key: LEAD_ALERT_WEBHOOK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_TO_EMAIL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ALERT_TO
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v22.0

  - type: web
    name: desarrollo-web-4ec5-static
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        value: https://desarrollo-web-4ec5.onrender.com/api
      - key: VITE_SITE_URL
        value: https://desarrollo-web-4ec5-static.onrender.com
      - key: VITE_HUBSPOT_PORTAL_ID
        sync: false
      - key: VITE_GOOGLE_ADS_SEND_TO
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: VITE_FACEBOOK_PIXEL_ID
        sync: false
      - key: VITE_TIKTOK_PIXEL_ID
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      - path: /brand-logo-transparent.png
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      - path: /brand-logo.png
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      - path: /brand-logo-tight.png
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# If you later want users, orders, and admin-managed products to persist
# across restarts, switch the API service to a paid plan and attach a disk:
#
#    disk:
#      name: data
#      mountPath: /opt/render/project/src/server/data
#      sizeGB: 1
